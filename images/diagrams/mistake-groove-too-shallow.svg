<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" font-family="Segoe UI, system-ui, sans-serif">
  <title>Schematic of a groove that is too shallow</title>
  <desc>Schematic diagram comparing a groove that is too shallow, where fabric pops back up, with a slot about 1/4 inch deep that holds the edge. Not a photo of a product or an item for sale.</desc>
  <defs>
    <pattern id="foam" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#f3eadc"/>
      <path d="M-1 1 l2 -2 M0 10 L10 0 M9 11 l2 -2" stroke="#e4d5c2" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#8d4e3c"/>
    </marker>
  </defs>
  <rect width="640" height="520" fill="#fffcf6"/>
  <text x="32" y="40" fill="#1e1a16" font-size="22" font-weight="700">Schematic</text>
  <text x="200" y="40" fill="#5e574e" font-size="18">Mistake &#8212; groove too shallow</text>

  <!-- Problem -->
  <rect x="24" y="64" width="292" height="360" fill="#fffdf8" stroke="#e3d9cb"/>
  <text x="40" y="98" fill="#8d4e3c" font-size="18" font-weight="700">Too shallow</text>
  <rect x="48" y="200" width="244" height="100" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <path d="M150 200 Q162 206 174 200" fill="none" stroke="#1e1a16" stroke-width="2"/>
  <path d="M70 168 H150 Q162 150 174 168 H270 V184 H174 Q162 166 150 184 H70 Z" fill="#c4654a" stroke="#1e1a16" stroke-width="1.25"/>
  <line x1="162" y1="148" x2="162" y2="118" stroke="#8d4e3c" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="40" y="340" fill="#1e1a16" font-size="16">A scratch, not a slot.</text>
  <text x="40" y="366" fill="#1e1a16" font-size="16">The edge pops back up.</text>
  <text x="40" y="392" fill="#5e574e" font-size="15">Forcing it makes a ridge.</text>

  <!-- Better -->
  <rect x="324" y="64" width="292" height="360" fill="#fffdf8" stroke="#e3d9cb"/>
  <text x="340" y="98" fill="#1a4f3c" font-size="18" font-weight="700">Deep enough</text>
  <rect x="348" y="200" width="244" height="100" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <rect x="458" y="200" width="20" height="28" fill="#e7dccb" stroke="#1e1a16" stroke-width="1.5"/>
  <rect x="348" y="188" width="110" height="12" fill="#c4654a"/>
  <rect x="458" y="194" width="10" height="30" fill="#c4654a"/>
  <rect x="478" y="188" width="114" height="12" fill="#3d6b58"/>
  <rect x="468" y="194" width="10" height="30" fill="#3d6b58"/>
  <line x1="448" y1="200" x2="448" y2="228" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="442" y1="200" x2="454" y2="200" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="442" y1="228" x2="454" y2="228" stroke="#5e574e" stroke-width="1.5"/>
  <text x="340" y="340" fill="#1e1a16" font-size="16">A slot about 1/4 inch deep.</text>
  <text x="340" y="366" fill="#1e1a16" font-size="16">The edge stays down.</text>
  <text x="340" y="392" fill="#5e574e" font-size="15">The face stays flat.</text>

  <text x="32" y="470" fill="#5e574e" font-size="16">Schematic diagram &#8212; not a photo of a finished product or item for sale.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 700" width="840" height="700" font-family="Segoe UI, system-ui, sans-serif">
  <title>Framing a flat kinusaiga panel</title>
  <desc>Schematic of a frame rabbet covering the bare foam margin of a flat kinusaiga panel. The front view is a stem and four lobes. Not a photograph and not an item for sale.</desc>
  <defs>
    <pattern id="foam" patternUnits="userSpaceOnUse" width="9" height="9">
      <rect width="9" height="9" fill="#f4ebdc"/>
      <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="840" height="700" fill="#fbf7f0"/>
  <text x="36" y="34" fill="#5c564c" font-size="13" font-weight="700" letter-spacing="0.16em">SCHEMATIC</text>
  <text x="36" y="66" fill="#241e18" font-size="26" font-weight="700">Frame over the margin</text>
  <text x="36" y="92" fill="#5c564c" font-size="16">The lip hides bare foam. It stops before the leaf.</text>

  <text x="36" y="136" fill="#241e18" font-size="18" font-weight="700">Cross-section</text>

  <rect x="140" y="202" width="560" height="158" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <path d="M48 176 H228 V202 H150 V360 H48 Z" fill="#e7d3b0" stroke="#241e18" stroke-width="1.7" stroke-linejoin="round"/>
  <path d="M792 176 H612 V202 H690 V360 H792 Z" fill="#e7d3b0" stroke="#241e18" stroke-width="1.7" stroke-linejoin="round"/>
  <rect x="236" y="188" width="368" height="16" fill="#f4e6c6" stroke="#241e18" stroke-width="1.3"/>
  <rect x="300" y="188" width="64" height="16" fill="#3d6b58" stroke="#241e18" stroke-width="1.1"/>
  <rect x="364" y="188" width="22" height="16" fill="#8d4e3c" stroke="#241e18" stroke-width="1.1"/>
  <rect x="386" y="188" width="64" height="16" fill="#c4654a" stroke="#241e18" stroke-width="1.1"/>
  <rect x="450" y="188" width="48" height="16" fill="#8faf62" stroke="#241e18" stroke-width="1.1"/>
  <line x1="236" y1="202" x2="236" y2="360" stroke="#241e18" stroke-width="1.15" stroke-dasharray="4 3"/>
  <line x1="604" y1="202" x2="604" y2="360" stroke="#241e18" stroke-width="1.15" stroke-dasharray="4 3"/>

  <text x="138" y="166" fill="#241e18" font-size="14" font-weight="700" text-anchor="middle">Frame lip</text>
  <text x="156" y="248" fill="#241e18" font-size="13" font-weight="700">Margin</text>
  <text x="420" y="286" fill="#241e18" font-size="15" font-weight="700" text-anchor="middle">Leaf stays in the opening</text>
  <text x="420" y="332" fill="#5c564c" font-size="14" text-anchor="middle">Foam, about 1 inch</text>

  <line x1="656" y1="214" x2="656" y2="348" stroke="#5c564c" stroke-width="1.25"/>
  <line x1="650" y1="214" x2="662" y2="214" stroke="#5c564c" stroke-width="1.25"/>
  <line x1="650" y1="348" x2="662" y2="348" stroke="#5c564c" stroke-width="1.25"/>
  <text x="664" y="286" fill="#5c564c" font-size="13">~1 in</text>

  <text x="36" y="408" fill="#241e18" font-size="16" font-weight="700">A shallow photo frame will not take this board.</text>
  <text x="36" y="434" fill="#5c564c" font-size="16">Do not crush the foam to force it in. Hang the frame, not the foam.</text>

  <text x="36" y="488" fill="#241e18" font-size="18" font-weight="700">From the front</text>
  <rect x="48" y="508" width="250" height="156" fill="#e7d3b0" stroke="#241e18" stroke-width="1.7"/>
  <rect x="92" y="540" width="162" height="92" fill="#f4e6c6" stroke="#241e18" stroke-width="1.4"/>
  <ellipse cx="174" cy="556" rx="17" ry="13" fill="#3d6b58" stroke="#241e18" stroke-width="1.15"/>
  <ellipse cx="153" cy="583" rx="16" ry="14" fill="#8faf62" stroke="#241e18" stroke-width="1.15"/>
  <ellipse cx="193" cy="582" rx="16" ry="14" fill="#c4654a" stroke="#241e18" stroke-width="1.15"/>
  <ellipse cx="159" cy="613" rx="14" ry="11" fill="#e4b184" stroke="#241e18" stroke-width="1.15"/>
  <rect x="169" y="572" width="9" height="57" rx="3" fill="#8d4e3c" stroke="#241e18" stroke-width="1.1"/>

  <text x="330" y="548" fill="#241e18" font-size="15" font-weight="700">The lip covers the margin.</text>
  <text x="330" y="576" fill="#5c564c" font-size="15">The leaf stays fully in view.</text>
  <text x="330" y="616" fill="#241e18" font-size="15" font-weight="700">Hardware goes on the frame.</text>
  <text x="330" y="644" fill="#5c564c" font-size="15">No nail through the foam face.</text>
</svg>

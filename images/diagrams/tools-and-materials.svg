<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 980" width="840" height="980" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tools and materials</title>
  <desc>Schematic of about 1-inch XPS foam, a double-sided adhesive sheet, a craft knife, and a blunt tucking tool. Not product photos and not items for sale.</desc>
  <defs>
  <pattern id="foam" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#f4ebdc"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamSide" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#e7d8c4"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamDark" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#d9c7b0"/>
    <path d="M0 9 L9 0" stroke="#b7a48c" stroke-width="0.8"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#241e18"/>
  </marker>
  <marker id="arrW" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#8f3d32"/>
  </marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#1a4f3c"/>
  </marker>
</defs>
  <rect width="840" height="980" fill="#fbf7f0"/>
  <text x="36" y="34" fill="#5c564c" font-size="13" font-weight="700" letter-spacing="0.16em">SCHEMATIC</text>
  <text x="36" y="66" fill="#241e18" font-size="26" font-weight="700">Tools and materials</text>
  <text x="36" y="92" fill="#5c564c" font-size="16">Generic kinds. No brand, and nothing here is for sale.</text>
  <rect x="36.00" y="120.00" width="366.00" height="390.00" rx="2" fill="#fffdf8" stroke="#e3d6c6" stroke-width="1.4"/>
  <text x="54.0" y="156.0" fill="#241e18" font-size="18" font-weight="700" text-anchor="start">XPS foam, about 1 inch</text>
  <text x="54.0" y="480.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">Firm board. Display foam is usually too thin.</text>
  <rect x="438.00" y="120.00" width="366.00" height="390.00" rx="2" fill="#fffdf8" stroke="#e3d6c6" stroke-width="1.4"/>
  <text x="456.0" y="156.0" fill="#241e18" font-size="18" font-weight="700" text-anchor="start">Double-sided sheet</text>
  <text x="456.0" y="480.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">Liner peels. Adhesive meets the foam face.</text>
  <rect x="36.00" y="540.00" width="366.00" height="390.00" rx="2" fill="#fffdf8" stroke="#e3d6c6" stroke-width="1.4"/>
  <text x="54.0" y="576.0" fill="#241e18" font-size="18" font-weight="700" text-anchor="start">Craft knife</text>
  <text x="54.0" y="900.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">A sharp, thin blade. Replace it when it crushes.</text>
  <rect x="438.00" y="540.00" width="366.00" height="390.00" rx="2" fill="#fffdf8" stroke="#e3d6c6" stroke-width="1.4"/>
  <text x="456.0" y="576.0" fill="#241e18" font-size="18" font-weight="700" text-anchor="start">Tucking tool</text>
  <text x="456.0" y="900.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">Push with the ball. Do not use the point.</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="Segoe UI, system-ui, sans-serif">
  <title>Schematic of crushed foam</title>
  <desc>Schematic diagram comparing a clean foam groove cut by a sharp blade with foam crushed by a dull blade so the cloth cannot stay in the slot. Not a photo of a product or an item for sale.</desc>
  <defs>
    <pattern id="foam" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#f3eadc"/>
      <path d="M-1 1 l2 -2 M0 10 L10 0 M9 11 l2 -2" stroke="#e4d5c2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="540" fill="#fffcf6"/>
  <text x="32" y="40" fill="#1e1a16" font-size="22" font-weight="700">Schematic</text>
  <text x="200" y="40" fill="#5e574e" font-size="18">Mistake &#8212; foam crushed</text>

  <rect x="24" y="64" width="292" height="380" fill="#fffdf8" stroke="#e3d9cb"/>
  <text x="40" y="98" fill="#1a4f3c" font-size="18" font-weight="700">Clean cut</text>
  <g transform="translate(78,128) rotate(-20)">
    <rect x="0" y="-8" width="70" height="16" rx="4" fill="#4a4038" stroke="#1e1a16"/>
    <polygon points="70,-2 108,0 70,2" fill="#ece8e2" stroke="#1e1a16"/>
  </g>
  <text x="168" y="150" fill="#5e574e" font-size="15">Sharp blade</text>
  <rect x="48" y="190" width="244" height="100" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <rect x="158" y="190" width="18" height="32" fill="#fffcf6" stroke="#1e1a16" stroke-width="1.75"/>
  <rect x="48" y="178" width="110" height="12" fill="#c4654a"/>
  <rect x="158" y="184" width="8" height="34" fill="#c4654a"/>
  <text x="40" y="332" fill="#1e1a16" font-size="16">Walls stay apart.</text>
  <text x="40" y="358" fill="#1e1a16" font-size="16">The edge has a slot.</text>
  <text x="40" y="390" fill="#5e574e" font-size="15">Ease off if the knife drags.</text>

  <rect x="324" y="64" width="292" height="380" fill="#fffdf8" stroke="#e3d9cb"/>
  <text x="340" y="98" fill="#8d4e3c" font-size="18" font-weight="700">Crushed</text>
  <g transform="translate(378,132) rotate(-20)">
    <rect x="0" y="-8" width="70" height="16" rx="4" fill="#4a4038" stroke="#1e1a16"/>
    <path d="M70 0 Q88 -6 96 0 Q88 6 70 0 Z" fill="#b7b1a8" stroke="#1e1a16"/>
  </g>
  <text x="468" y="150" fill="#5e574e" font-size="15">Dull blade</text>
  <rect x="348" y="190" width="244" height="100" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <!-- collapsed walls -->
  <path d="M450 190 C458 200 470 206 466 222 C474 214 486 206 492 190" fill="#e7dccb" stroke="#1e1a16" stroke-width="1.75"/>
  <path d="M70 168 H250 V180 H70 Z" transform="translate(300,0)" fill="#c4654a" stroke="#1e1a16" stroke-width="1.25"/>
  <text x="340" y="332" fill="#1e1a16" font-size="16">Walls collapse inward.</text>
  <text x="340" y="358" fill="#1e1a16" font-size="16">Cloth sits on top.</text>
  <text x="340" y="390" fill="#5e574e" font-size="15">Swap the blade. Do not lean harder.</text>

  <text x="32" y="490" fill="#5e574e" font-size="16">Schematic diagram &#8212; not a photo of a finished product or item for sale.</text>
</svg>

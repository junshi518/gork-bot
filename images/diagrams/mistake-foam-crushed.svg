  <text x="660.0" y="220.0" fill="#1a4f3c" font-size="14" font-weight="500" text-anchor="start">Sharp blade</text>
  <rect x="470.00" y="280.00" width="300.00" height="130.00" rx="0" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="608.00" y="280.00" width="22.00" height="40.00" rx="0" fill="#fbf7f0" stroke="#241e18" stroke-width="1.6"/>
  <path d="M 500.00 258.00 L 610.00 258.00 L 618.00 268.00 L 620.00 312.00" fill="none" stroke="#c4654a" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 500.00 258.00 L 610.00 258.00 L 618.00 268.00 L 620.00 312.00" fill="none" stroke="#241e18" stroke-width="1.15" stroke-linecap="butt" stroke-linejoin="round"/>
  <text x="470.0" y="450.0" fill="#1a4f3c" font-size="16" font-weight="700" text-anchor="start">Walls stay apart. The edge has a slot.</text>
  <text x="470.0" y="478.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">Change the blade when the cut looks torn.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 820" width="840" height="820" font-family="Segoe UI, system-ui, sans-serif">
  <title>First leaf pattern in plan</title>
  <desc>Schematic plan of a first kinusaiga pattern: a foam margin, a border groove, a background, four simple lobes, and a stem. Not a photograph and not an item for sale.</desc>
  <defs>
    <pattern id="foam" patternUnits="userSpaceOnUse" width="9" height="9">
      <rect width="9" height="9" fill="#f4ebdc"/>
      <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
    </pattern>
  </defs>
  <rect width="840" height="820" fill="#fbf7f0"/>
  <text x="36" y="34" fill="#5c564c" font-size="13" font-weight="700" letter-spacing="0.16em">SCHEMATIC</text>
  <text x="36" y="66" fill="#241e18" font-size="26" font-weight="700">First leaf, in plan</text>
  <text x="36" y="92" fill="#5c564c" font-size="16">Draw a stem and four lobes. Leave the outer foam bare.</text>

  <rect x="70" y="140" width="430" height="520" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="145" y="210" width="280" height="380" fill="#f4e6c6" stroke="#241e18" stroke-width="1.7" stroke-dasharray="7 5"/>

  <ellipse cx="285" cy="300" rx="62" ry="48" fill="#3d6b58" stroke="#241e18" stroke-width="1.5"/>
  <ellipse cx="210" cy="400" rx="58" ry="50" fill="#8faf62" stroke="#241e18" stroke-width="1.5"/>
  <ellipse cx="355" cy="395" rx="58" ry="52" fill="#c4654a" stroke="#241e18" stroke-width="1.5"/>
  <ellipse cx="230" cy="510" rx="52" ry="42" fill="#e4b184" stroke="#241e18" stroke-width="1.5"/>
  <rect x="268" y="360" width="34" height="210" rx="10" fill="#8d4e3c" stroke="#241e18" stroke-width="1.5"/>

  <circle cx="168" cy="236" r="12" fill="#fffcf6" stroke="#241e18" stroke-width="1.4"/>
  <text x="168" y="241" fill="#241e18" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <circle cx="285" cy="292" r="12" fill="#fffcf6" stroke="#241e18" stroke-width="1.4"/>
  <text x="285" y="297" fill="#241e18" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <circle cx="285" cy="470" r="12" fill="#fffcf6" stroke="#241e18" stroke-width="1.4"/>
  <text x="285" y="475" fill="#241e18" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <circle cx="168" cy="540" r="12" fill="#fffcf6" stroke="#241e18" stroke-width="1.4"/>
  <text x="168" y="545" fill="#241e18" font-size="14" font-weight="700" text-anchor="middle">4</text>

  <line x1="500" y1="250" x2="430" y2="250" stroke="#241e18" stroke-width="1.2"/>
  <text x="512" y="246" fill="#241e18" font-size="15" font-weight="700">Foam margin</text>
  <text x="512" y="268" fill="#5c564c" font-size="14">Bare. Do not fill it.</text>

  <line x1="500" y1="340" x2="400" y2="360" stroke="#241e18" stroke-width="1.2"/>
  <text x="512" y="336" fill="#241e18" font-size="15" font-weight="700">Four lobes</text>
  <text x="512" y="358" fill="#5c564c" font-size="14">Rounded. No needle tips.</text>

  <line x1="500" y1="450" x2="302" y2="500" stroke="#241e18" stroke-width="1.2"/>
  <text x="512" y="446" fill="#241e18" font-size="15" font-weight="700">Stem</text>
  <text x="512" y="468" fill="#5c564c" font-size="14">About a finger wide.</text>

  <line x1="500" y1="540" x2="425" y2="580" stroke="#241e18" stroke-width="1.2"/>
  <text x="512" y="536" fill="#241e18" font-size="15" font-weight="700">Border groove</text>
  <text x="512" y="558" fill="#5c564c" font-size="14">The dashed line.</text>

  <text x="70" y="710" fill="#241e18" font-size="16" font-weight="700">Tuck order: 1 background, 2 lobes, 3 stem, 4 border.</text>
  <text x="70" y="740" fill="#5c564c" font-size="16">Where two colors meet, draw one shared line.</text>
  <text x="70" y="770" fill="#5c564c" font-size="15">Score the dark lines. Leave the margin bare.</text>
</svg>

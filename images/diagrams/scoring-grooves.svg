<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 1040" width="840" height="1040" font-family="Segoe UI, system-ui, sans-serif">
  <title>Scoring the groove</title>
  <desc>Schematic of scoring a groove about 1/4 inch deep into about 1 inch of foam, through the pattern and liner. Not a photograph and not an item for sale.</desc>
  <defs>
  <pattern id="foam" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#f4ebdc"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamSide" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#e7d8c4"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamDark" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#d9c7b0"/>
    <path d="M0 9 L9 0" stroke="#b7a48c" stroke-width="0.8"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#241e18"/>
  </marker>
  <marker id="arrW" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#8f3d32"/>
  </marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#1a4f3c"/>
  </marker>
</defs>

  <text x="36.0" y="455.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">The dark slot is the channel already cut. The dashes are still to score.</text>
  <text x="620.0" y="200.0" fill="#241e18" font-size="15" font-weight="700" text-anchor="start">Move this way</text>
  <line x1="333.69" y1="269.00" x2="389.12" y2="237.00" stroke="#241e18" stroke-width="1.8" fill="none" marker-end="url(#arr)"/>
  <text x="36.0" y="500.0" fill="#241e18" font-size="18" font-weight="700" text-anchor="start">2   How deep</text>
  <text x="200.0" y="500.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">Cut a slot. Do not separate the board.</text>

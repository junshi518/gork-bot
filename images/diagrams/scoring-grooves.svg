  <text x="438.0" y="632.0" fill="#241e18" font-size="14" font-weight="700" text-anchor="start">Stops in the foam</text>
  <text x="36.0" y="900.0" fill="#241e18" font-size="16" font-weight="700" text-anchor="start">Stop while foam remains under the groove.</text>
  <text x="36.0" y="928.0" fill="#5c564c" font-size="16" font-weight="500" text-anchor="start">A break through the back ruins the board.</text>
  <text x="36.0" y="990.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">Score every drawn line. Several scratches are not a slot.</text>

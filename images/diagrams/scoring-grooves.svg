  <text x="36.0" y="552.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">Paper pattern</text>
  <text x="36.0" y="568.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">Liner</text>

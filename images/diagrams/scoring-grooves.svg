  <rect x="200.00" y="554.00" width="460.00" height="12.00" rx="0" fill="#f6f1e6" stroke="#241e18" stroke-width="1.3"/>
  <rect x="200.00" y="566.00" width="460.00" height="8.00" rx="0" fill="#c4923a" stroke="#241e18" stroke-width="1.3"/>

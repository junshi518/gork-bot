  <text x="36" y="92" fill="#5c564c" font-size="16">The knife follows the drawn line. The section shows how deep the channel is.</text>
  <text x="36.0" y="130.0" fill="#241e18" font-size="18" font-weight="700" text-anchor="start">1   Along the line</text>

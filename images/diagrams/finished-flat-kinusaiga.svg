<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" width="640" height="760" font-family="Segoe UI, system-ui, sans-serif">
  <title>Schematic of a finished flat kinusaiga</title>
  <desc>Schematic diagram of a finished flat kinusaiga: large simple fabric shapes on a foam board, with a side section showing cloth tucked into grooves. Not a photo of a finished product or an item for sale.</desc>
  <defs>
    <pattern id="foam" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#f3eadc"/>
      <path d="M-1 1 l2 -2 M0 10 L10 0 M9 11 l2 -2" stroke="#e4d5c2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="760" fill="#fffcf6"/>
  <text x="32" y="40" fill="#1e1a16" font-size="22" font-weight="700">Schematic</text>
  <text x="200" y="40" fill="#5e574e" font-size="18">Finished flat kinusaiga &#8212; front view</text>

  <!-- Flat board, front -->
  <rect x="110" y="64" width="420" height="336" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <rect x="134" y="88" width="372" height="288" fill="#f4e6c4" stroke="#1e1a16" stroke-width="3"/>
  <rect x="134" y="268" width="372" height="108" fill="#3d6b58" stroke="#1e1a16" stroke-width="3"/>
  <circle cx="230" cy="176" r="64" fill="#c4654a" stroke="#1e1a16" stroke-width="3"/>
  <rect x="318" y="200" width="120" height="68" fill="#ead7b0" stroke="#1e1a16" stroke-width="3"/>
  <polygon points="302,200 378,132 454,200" fill="#8d4e3c" stroke="#1e1a16" stroke-width="3" stroke-linejoin="miter"/>

  <!-- Legend -->
  <rect x="32" y="420" width="18" height="18" fill="#c4654a" stroke="#1e1a16"/>
  <text x="58" y="435" fill="#1e1a16" font-size="16">Fabric shape</text>
  <line x1="196" y1="429" x2="228" y2="429" stroke="#1e1a16" stroke-width="3"/>
  <text x="236" y="435" fill="#1e1a16" font-size="16">Groove</text>
  <rect x="330" y="420" width="18" height="18" fill="url(#foam)" stroke="#1e1a16"/>
  <text x="356" y="435" fill="#1e1a16" font-size="16">Foam margin</text>
  <text x="32" y="468" fill="#5e574e" font-size="16">Large simple shapes on one flat face. Dark lines are tucked grooves.</text>

  <!-- Side section -->
  <text x="32" y="512" fill="#1e1a16" font-size="18" font-weight="700">Side section</text>
  <text x="180" y="512" fill="#5e574e" font-size="16">Typical tuck. Not a slice through the drawing above.</text>

  <line x1="78" y1="536" x2="78" y2="560" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="72" y1="536" x2="84" y2="536" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="72" y1="560" x2="84" y2="560" stroke="#5e574e" stroke-width="1.5"/>
  <text x="28" y="528" fill="#5e574e" font-size="14">~1/4 in</text>

  <line x1="108" y1="536" x2="108" y2="648" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="102" y1="536" x2="114" y2="536" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="102" y1="648" x2="114" y2="648" stroke="#5e574e" stroke-width="1.5"/>
  <text x="36" y="600" fill="#5e574e" font-size="14">~1 in</text>

  <rect x="132" y="536" width="476" height="112" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <rect x="250" y="536" width="22" height="30" fill="#e7dccb" stroke="#1e1a16" stroke-width="1.5"/>
  <rect x="430" y="536" width="22" height="30" fill="#e7dccb" stroke="#1e1a16" stroke-width="1.5"/>

  <rect x="132" y="522" width="118" height="14" fill="#c4654a"/>
  <rect x="250" y="528" width="10" height="34" fill="#c4654a"/>
  <rect x="262" y="528" width="10" height="34" fill="#f4e6c4"/>
  <rect x="272" y="522" width="158" height="14" fill="#f4e6c4"/>
  <rect x="430" y="528" width="10" height="34" fill="#f4e6c4"/>
  <rect x="442" y="528" width="10" height="34" fill="#3d6b58"/>
  <rect x="452" y="522" width="156" height="14" fill="#3d6b58"/>

  <line x1="271" y1="562" x2="271" y2="590" stroke="#5e574e" stroke-width="1.25"/>
  <line x1="271" y1="590" x2="300" y2="590" stroke="#5e574e" stroke-width="1.25"/>
  <text x="308" y="594" fill="#1e1a16" font-size="16">Tucked edge</text>

  <text x="32" y="692" fill="#1e1a16" font-size="16">The finished piece is a flat board. It is not a three-dimensional form.</text>
  <text x="32" y="720" fill="#5e574e" font-size="16">Schematic diagram &#8212; not a photo of a finished product or item for sale.</text>
</svg>

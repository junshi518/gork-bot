<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" font-family="Segoe UI, system-ui, sans-serif">
  <title>Schematic of applying double-sided adhesive</title>
  <desc>Schematic diagram of pressing a double-sided adhesive sheet onto foam and peeling the liner for one shape at a time. Not a photo of a product or an item for sale.</desc>
  <defs>
    <pattern id="foam" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#f3eadc"/>
      <path d="M-1 1 l2 -2 M0 10 L10 0 M9 11 l2 -2" stroke="#e4d5c2" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1e1a16"/>
    </marker>
  </defs>
  <rect width="640" height="860" fill="#fffcf6"/>
  <text x="32" y="40" fill="#1e1a16" font-size="22" font-weight="700">Schematic</text>
  <text x="200" y="40" fill="#5e574e" font-size="18">Applying the adhesive sheet</text>

  <!-- Step 1 -->
  <circle cx="48" cy="92" r="14" fill="#1e1a16"/>
  <text x="48" y="97" text-anchor="middle" fill="#fffcf6" font-size="16" font-weight="700">1</text>
  <text x="74" y="98" fill="#1e1a16" font-size="18" font-weight="700">Bare working face</text>
  <rect x="74" y="118" width="280" height="72" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <text x="370" y="160" fill="#5e574e" font-size="16">About 1 inch of foam.</text>
  <text x="370" y="184" fill="#5e574e" font-size="16">Nothing stuck down yet.</text>

  <!-- Step 2 -->
  <circle cx="48" cy="250" r="14" fill="#1e1a16"/>
  <text x="48" y="255" text-anchor="middle" fill="#fffcf6" font-size="16" font-weight="700">2</text>
  <text x="74" y="256" fill="#1e1a16" font-size="18" font-weight="700">Press the sheet onto the whole face</text>

  <rect x="120" y="284" width="300" height="16" fill="#fffdf8" stroke="#1e1a16" stroke-width="1.5"/>
  <text x="432" y="297" fill="#5e574e" font-size="16">Top liner</text>
  <rect x="120" y="308" width="300" height="14" fill="#c4923a" stroke="#1e1a16" stroke-width="1.5"/>
  <text x="432" y="320" fill="#5e574e" font-size="16">Adhesive</text>
  <line x1="270" y1="330" x2="270" y2="358" stroke="#1e1a16" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="100" y="366" width="340" height="78" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <text x="120" y="470" fill="#1e1a16" font-size="16">Leave the top liner on while you score.</text>

  <!-- Step 3 -->
  <circle cx="48" cy="524" r="14" fill="#1e1a16"/>
  <text x="48" y="529" text-anchor="middle" fill="#fffcf6" font-size="16" font-weight="700">3</text>
  <text x="74" y="530" fill="#1e1a16" font-size="18" font-weight="700">Peel one shape when you tuck it</text>

  <rect x="96" y="556" width="300" height="210" fill="#f7f1e6" stroke="#1e1a16" stroke-width="2"/>
  <circle cx="210" cy="670" r="58" fill="#c4923a" stroke="#1e1a16" stroke-width="1.5"/>
  <path d="M248 628 C300 600 360 640 352 700 C320 690 286 660 268 676 C278 650 260 640 248 628 Z" fill="#fffdf8" stroke="#1e1a16" stroke-width="1.5"/>
  <text x="420" y="600" fill="#1e1a16" font-size="16">Liner still on</text>
  <line x1="408" y1="594" x2="360" y2="580" stroke="#5e574e" stroke-width="1.25"/>
  <text x="420" y="660" fill="#1e1a16" font-size="16">Peeled flap</text>
  <line x1="408" y1="654" x2="330" y2="650" stroke="#5e574e" stroke-width="1.25"/>
  <text x="420" y="720" fill="#5e574e" font-size="16">Adhesive exposed</text>
  <text x="420" y="744" fill="#5e574e" font-size="16">for one shape.</text>

  <text x="32" y="812" fill="#1e1a16" font-size="16">Do not peel the whole sheet at once. Dust sticks to bare adhesive.</text>
  <text x="32" y="840" fill="#5e574e" font-size="16">Schematic diagram &#8212; not a photo of a finished product or item for sale.</text>
</svg>

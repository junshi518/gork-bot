  <path d="M 500.00 220.00 L 602.00 220.00 L 610.00 230.00 L 612.00 254.00" fill="none" stroke="#241e18" stroke-width="1.15" stroke-linecap="butt" stroke-linejoin="round"/>
  <text x="448.0" y="360.0" fill="#1a4f3c" font-size="15" font-weight="700" text-anchor="start">2. Then trim the tail</text>
  <rect x="448.00" y="384.00" width="230.00" height="78.00" rx="0" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="548.00" y="384.00" width="18.00" height="24.00" rx="0" fill="#fbf7f0" stroke="#241e18" stroke-width="1.4"/>
  <rect x="448.00" y="370.00" width="92.00" height="14.00" rx="0" fill="#c4654a" stroke="#241e18" stroke-width="1.1"/>
  <rect x="548.00" y="378.00" width="10.00" height="24.00" rx="0" fill="#c4654a" stroke="#241e18" stroke-width="1"/>
  <rect x="566.00" y="356.00" width="16.00" height="14.00" rx="0" fill="#c4654a" stroke="#241e18" stroke-width="1.1"/>
  <rect x="582.00" y="370.00" width="80.00" height="14.00" rx="0" fill="#3d6b58" stroke="#241e18" stroke-width="1.1"/>

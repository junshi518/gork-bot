  <text x="70.0" y="550.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">No edge is left to push in.</text>
  <text x="70.0" y="576.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">The channel stays empty.</text>
  <text x="448.0" y="214.0" fill="#1a4f3c" font-size="15" font-weight="700" text-anchor="start">1. Tuck the margin first</text>

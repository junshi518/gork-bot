<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 720" width="840" height="720" font-family="Segoe UI, system-ui, sans-serif">
  <title>Cut to shape too soon</title>
  <desc>Schematic comparing fabric cut to the final outline before tucking with fabric tucked first and trimmed after. Not a photograph and not an item for sale.</desc>
  <defs>
  <pattern id="foam" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#f4ebdc"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamSide" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#e7d8c4"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamDark" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#d9c7b0"/>
    <path d="M0 9 L9 0" stroke="#b7a48c" stroke-width="0.8"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#241e18"/>
  </marker>
  <marker id="arrW" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#8f3d32"/>
  </marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#1a4f3c"/>
  </marker>
</defs>
  <rect width="840" height="720" fill="#fbf7f0"/>
  <text x="36" y="34" fill="#5c564c" font-size="13" font-weight="700" letter-spacing="0.16em">SCHEMATIC</text>
  <text x="36" y="66" fill="#241e18" font-size="26" font-weight="700">Cut to shape too soon</text>
  <text x="36" y="92" fill="#5c564c" font-size="16">The groove can hold only the cloth you have not trimmed away.</text>
  <rect x="28.00" y="120.00" width="384.00" height="550.00" rx="2" fill="#fffdf8" stroke="#e3d6c6" stroke-width="1.4"/>
  <rect x="428.00" y="120.00" width="384.00" height="550.00" rx="2" fill="#fffdf8" stroke="#e3d6c6" stroke-width="1.4"/>
  <rect x="48.00" y="140.00" width="58.00" height="28.00" rx="3" fill="#f8ebe7" stroke="#8f3d32" stroke-width="1.4"/>
  <text x="77.0" y="159.0" fill="#8f3d32" font-size="14" font-weight="700" text-anchor="middle">Wrong</text>
  <rect x="448.00" y="140.00" width="58.00" height="28.00" rx="3" fill="#e7f0eb" stroke="#1a4f3c" stroke-width="1.4"/>
  <text x="477.0" y="159.0" fill="#1a4f3c" font-size="14" font-weight="700" text-anchor="middle">Right</text>
  <g transform="translate(250.0 155.0) rotate(-18)"><circle cx="0" cy="15.3" r="10.2" fill="#fffcf6" stroke="#241e18" stroke-width="1.6"/><circle cx="23.8" cy="15.3" r="10.2" fill="#fffcf6" stroke="#241e18" stroke-width="1.6"/><circle cx="13.6" cy="0.8" r="2.9" fill="#3a342e" stroke="#241e18" stroke-width="1.1"/><polygon points="10.2,-0.8 5.1,-6.0 54.4,-34.0 18.7,-1.7" fill="#d9d4cc" stroke="#241e18" stroke-width="1.25" stroke-linejoin="round"/><polygon points="17.0,-0.8 23.8,-6.8 62.9,-25.5 22.1,2.5" fill="#d9d4cc" stroke="#241e18" stroke-width="1.25" stroke-linejoin="round"/></g>
  <text x="70.0" y="200.0" fill="#8f3d32" font-size="14" font-weight="500" text-anchor="start">Already cut to the outline</text>
  <rect x="70.00" y="250.00" width="300.00" height="110.00" rx="0" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="200.00" y="250.00" width="24.00" height="30.00" rx="0" fill="#fbf7f0" stroke="#241e18" stroke-width="1.5"/>
  <rect x="70.00" y="234.00" width="130.00" height="16.00" rx="0" fill="#c4654a" stroke="#241e18" stroke-width="1.2"/>
  <rect x="224.00" y="234.00" width="146.00" height="16.00" rx="0" fill="#3d6b58" stroke="#241e18" stroke-width="1.2"/>
  <text x="70.0" y="400.0" fill="#8f3d32" font-size="16" font-weight="700" text-anchor="start">The cloth matches the outline.</text>
  <text x="70.0" y="428.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">No edge is left to push in.</text>
  <text x="70.0" y="460.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">The channel stays empty.</text>
  <text x="448.0" y="178.0" fill="#1a4f3c" font-size="15" font-weight="700" text-anchor="start">1. Tuck the margin first</text>
  <rect x="470.00" y="248.00" width="300.00" height="86.00" rx="0" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="600.00" y="248.00" width="24.00" height="26.00" rx="0" fill="#fbf7f0" stroke="#241e18" stroke-width="1.4"/>
  <path d="M 500.00 232.00 L 602.00 232.00 L 610.00 242.00 L 612.00 268.00" fill="none" stroke="#c4654a" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 500.00 232.00 L 602.00 232.00 L 610.00 242.00 L 612.00 268.00" fill="none" stroke="#241e18" stroke-width="1.15" stroke-linecap="butt" stroke-linejoin="round"/>
  <text x="448.0" y="368.0" fill="#1a4f3c" font-size="15" font-weight="700" text-anchor="start">2. Then trim the tail</text>
  <rect x="448.00" y="408.00" width="250.00" height="86.00" rx="0" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="560.00" y="408.00" width="20.00" height="28.00" rx="0" fill="#fbf7f0" stroke="#241e18" stroke-width="1.4"/>
  <rect x="448.00" y="394.00" width="104.00" height="14.00" rx="0" fill="#c4654a" stroke="#241e18" stroke-width="1.1"/>
  <rect x="560.00" y="402.00" width="10.00" height="28.00" rx="0" fill="#c4654a" stroke="#241e18" stroke-width="1"/>
  <rect x="578.00" y="380.00" width="14.00" height="14.00" rx="0" fill="#c4654a" stroke="#241e18" stroke-width="1.1"/>
  <rect x="592.00" y="394.00" width="90.00" height="14.00" rx="0" fill="#3d6b58" stroke="#241e18" stroke-width="1.1"/>
  <g transform="translate(700.0 360.0) rotate(12)"><circle cx="0" cy="12.6" r="8.4" fill="#fffcf6" stroke="#241e18" stroke-width="1.6"/><circle cx="19.6" cy="12.6" r="8.4" fill="#fffcf6" stroke="#241e18" stroke-width="1.6"/><circle cx="11.2" cy="0.7" r="2.4" fill="#3a342e" stroke="#241e18" stroke-width="1.1"/><polygon points="8.4,-0.7 4.2,-4.9 44.8,-28.0 15.4,-1.4" fill="#d9d4cc" stroke="#241e18" stroke-width="1.25" stroke-linejoin="round"/><polygon points="14.0,-0.7 19.6,-5.6 51.8,-21.0 18.2,2.1" fill="#d9d4cc" stroke="#241e18" stroke-width="1.25" stroke-linejoin="round"/></g>
  <text x="470.0" y="520.0" fill="#1a4f3c" font-size="15" font-weight="500" text-anchor="start">The edge is already in the groove.</text>
  <text x="470.0" y="546.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">Scissors take only the leftover tail.</text>
</svg>

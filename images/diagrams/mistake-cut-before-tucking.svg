  <text x="77.0" y="157.0" fill="#8f3d32" font-size="14" font-weight="700" text-anchor="middle">Wrong</text>
  <rect x="448.00" y="138.00" width="58.00" height="28.00" rx="3" fill="#e7f0eb" stroke="#1a4f3c" stroke-width="1.4"/>
  <text x="477.0" y="157.0" fill="#1a4f3c" font-size="14" font-weight="700" text-anchor="middle">Right</text>

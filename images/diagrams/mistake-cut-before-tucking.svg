  <text x="470.0" y="500.0" fill="#1a4f3c" font-size="15" font-weight="500" text-anchor="start">The edge is already in the groove.</text>
  <text x="470.0" y="528.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">Scissors take only the leftover tail.</text>

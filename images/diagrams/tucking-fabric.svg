<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 880" width="840" height="880" font-family="Segoe UI, system-ui, sans-serif">
  <title>Tucking the fabric</title>
  <desc>Schematic of pushing a fabric edge into a foam groove with the flat back of a seam ripper, including a cutaway of the fold. Not a photograph and not an item for sale.</desc>
  <defs>
  <pattern id="foam" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#f4ebdc"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamSide" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#e7d8c4"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamDark" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#d9c7b0"/>
    <path d="M0 9 L9 0" stroke="#b7a48c" stroke-width="0.8"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#241e18"/>
  </marker>
  <marker id="arrW" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#8f3d32"/>
  </marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#1a4f3c"/>
  </marker>
</defs>
  <rect width="840" height="880" fill="#fbf7f0"/>
  <text x="36" y="34" fill="#5c564c" font-size="13" font-weight="700" letter-spacing="0.16em">SCHEMATIC</text>
  <text x="36" y="66" fill="#241e18" font-size="26" font-weight="700">Tucking the fabric</text>
  <text x="36" y="92" fill="#5c564c" font-size="16">The extra cloth is the part that goes into the channel.</text>
  <text x="36.0" y="130.0" fill="#241e18" font-size="18" font-weight="700" text-anchor="start">1   Lay the cloth past the line</text>
  <rect x="70.00" y="200.00" width="700.00" height="90.00" rx="0" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="392.00" y="200.00" width="22.00" height="26.00" rx="0" fill="#efe4d4" stroke="#241e18" stroke-width="1.4"/>
  <rect x="70.00" y="192.00" width="322.00" height="8.00" rx="0" fill="#c4923a" stroke="#241e18" stroke-width="1"/>
  <rect x="120.00" y="164.00" width="520.00" height="18.00" rx="0" fill="#c4654a" stroke="#241e18" stroke-width="1.3"/>
  <line x1="403.00" y1="164.00" x2="403.00" y2="200.00" stroke="#241e18" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <line x1="403.00" y1="150.00" x2="640.00" y2="150.00" stroke="#5c564c" stroke-width="1.25" fill="none"/>
  <line x1="403.00" y1="144.00" x2="403.00" y2="156.00" stroke="#5c564c" stroke-width="1.25" fill="none"/>
  <line x1="640.00" y1="144.00" x2="640.00" y2="156.00" stroke="#5c564c" stroke-width="1.25" fill="none"/>
  <text x="521.5" y="140.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="middle">Margin to tuck</text>
  <text x="70.0" y="320.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">Do not cut the cloth to the finished outline yet.</text>
  <text x="36.0" y="360.0" fill="#241e18" font-size="18" font-weight="700" text-anchor="start">2   Press the edge down</text>
  <rect x="60.00" y="520.00" width="720.00" height="190.00" rx="0" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="400.00" y="520.00" width="40.00" height="52.00" rx="0" fill="#fbf7f0" stroke="#241e18" stroke-width="1.7"/>
  <rect x="60.00" y="511.00" width="340.00" height="9.00" rx="0" fill="#c4923a" stroke="#241e18" stroke-width="1.1"/>
  <rect x="440.00" y="511.00" width="340.00" height="9.00" rx="0" fill="#c4923a" stroke="#241e18" stroke-width="1.1"/>
  <path d="M 100.00 500.00 L 402.00 500.00 L 410.00 510.00 L 412.00 564.00" fill="none" stroke="#c4654a" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 100.00 500.00 L 402.00 500.00 L 410.00 510.00 L 412.00 564.00" fill="none" stroke="#241e18" stroke-width="1.15" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 740.00 500.00 L 438.00 500.00 L 430.00 510.00 L 428.00 564.00" fill="none" stroke="#3d6b58" stroke-width="15" stroke-linecap="butt" stroke-linejoin="round"/>
  <path d="M 740.00 500.00 L 438.00 500.00 L 430.00 510.00 L 428.00 564.00" fill="none" stroke="#241e18" stroke-width="1.15" stroke-linecap="butt" stroke-linejoin="round"/>
  <g transform="translate(420.0 516.0) rotate(-90)"><path d="M 0 -9.3 L 8.1 -9.3 L 8.1 -7.5 L 45.2 -7.5 C 56.8 -7.5, 60.3 -2.3, 60.3 0 C 60.3 2.3, 56.8 7.5, 45.2 7.5 L 8.1 7.5 L 8.1 9.3 L 0 9.3 Z" fill="#3a342e" stroke="#241e18" stroke-width="1.5" stroke-linejoin="round"/><line x1="1.9" y1="-5.2" x2="1.9" y2="5.2" stroke="#6d645c" stroke-width="1.4" stroke-linecap="butt"/><line x1="18.6" y1="-4.1" x2="18.6" y2="4.1" stroke="#5a5148" stroke-width="1.25"/><rect x="56.8" y="-4.1" width="8.1" height="8.1" fill="#d9d4cc" stroke="#241e18" stroke-width="1.2"/><line x1="63.8" y1="0" x2="88.2" y2="0" stroke="#6e6860" stroke-width="2.4" stroke-linecap="butt"/><polygon points="84.7,-0.8 114.8,-18.6 118.3,-15.1 90.5,0.8" fill="#d9d4cc" stroke="#241e18" stroke-width="1.15" stroke-linejoin="round"/><line x1="87.0" y1="0.6" x2="98.6" y2="7.0" stroke="#6e6860" stroke-width="1.7" stroke-linecap="round"/><circle cx="100.9" cy="8.1" r="2.1" fill="#d9d4cc" stroke="#241e18" stroke-width="1.1"/></g>
  <text x="70.0" y="446.0" fill="#241e18" font-size="15" font-weight="700" text-anchor="start">Push with the flat back</text>
  <line x1="262.00" y1="438.00" x2="406.00" y2="506.00" stroke="#241e18" stroke-width="1.15" fill="none"/>
  <text x="456.0" y="548.0" fill="#241e18" font-size="15" font-weight="700" text-anchor="start">Edge in the channel</text>
  <text x="70.0" y="484.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">Adhesive on the face</text>
  <text x="36.0" y="750.0" fill="#241e18" font-size="16" font-weight="500" text-anchor="start">Both edges can share one groove. The face should lie flat.</text>
  <text x="36.0" y="800.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">Trim only the surplus that will not fit, and only after this tuck.</text>
  <line x1="382.00" y1="520.00" x2="382.00" y2="572.00" stroke="#241e18" stroke-width="1.25" fill="none"/>
  <line x1="376.00" y1="520.00" x2="388.00" y2="520.00" stroke="#241e18" stroke-width="1.25" fill="none"/>
  <line x1="376.00" y1="572.00" x2="388.00" y2="572.00" stroke="#241e18" stroke-width="1.25" fill="none"/>
  <text x="372.0" y="551.0" fill="#241e18" font-size="14" font-weight="500" text-anchor="end">~1/4 in</text>
  <text x="36.0" y="840.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">If the edge springs back, the groove is too shallow.</text>
</svg>

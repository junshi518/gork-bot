<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 760" width="840" height="760" font-family="Segoe UI, system-ui, sans-serif">
  <title>Foam thickness</title>
  <desc>Schematic comparing about 1 inch of XPS foam with regular display foam board that is usually too thin for a 1/4 inch groove. Not a photograph and not an item for sale.</desc>
  <defs>
  <pattern id="foam" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#f4ebdc"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamSide" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#e7d8c4"/>
    <path d="M0 9 L9 0" stroke="#cbbba4" stroke-width="0.8"/>
  </pattern>
  <pattern id="foamDark" patternUnits="userSpaceOnUse" width="9" height="9">
    <rect width="9" height="9" fill="#d9c7b0"/>
    <path d="M0 9 L9 0" stroke="#b7a48c" stroke-width="0.8"/>
  </pattern>
  <marker id="arr" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#241e18"/>
  </marker>
  <marker id="arrW" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#8f3d32"/>
  </marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="8" markerHeight="8" orient="auto">
    <path d="M0 1.1 L9.2 5 L0 8.9 Z" fill="#1a4f3c"/>
  </marker>
</defs>
  <rect width="840" height="760" fill="#fbf7f0"/>
  <text x="36" y="34" fill="#5c564c" font-size="13" font-weight="700" letter-spacing="0.16em">SCHEMATIC</text>
  <text x="36" y="66" fill="#241e18" font-size="26" font-weight="700">Foam thickness</text>
  <text x="36" y="92" fill="#5c564c" font-size="16">Same groove depth in both drawings: about 1/4 inch.</text>
  <rect x="28.00" y="120.00" width="384.00" height="580.00" rx="2" fill="#fffdf8" stroke="#e3d6c6" stroke-width="1.4"/>
  <rect x="428.00" y="120.00" width="384.00" height="580.00" rx="2" fill="#fffdf8" stroke="#e3d6c6" stroke-width="1.4"/>
  <text x="48.0" y="160.0" fill="#1a4f3c" font-size="20" font-weight="700" text-anchor="start">About 1 inch XPS</text>
  <text x="448.0" y="160.0" fill="#8f3d32" font-size="20" font-weight="700" text-anchor="start">Display foam board</text>
  <rect x="120.00" y="220.00" width="180.00" height="280.00" rx="0" fill="url(#foam)" stroke="#241e18" stroke-width="1.8"/>
  <rect x="196.00" y="220.00" width="22.00" height="70.00" rx="0" fill="#fbf7f0" stroke="#241e18" stroke-width="1.6"/>
  <line x1="90.00" y1="220.00" x2="90.00" y2="500.00" stroke="#5c564c" stroke-width="1.25" fill="none"/>
  <line x1="84.00" y1="220.00" x2="96.00" y2="220.00" stroke="#5c564c" stroke-width="1.25" fill="none"/>
  <line x1="84.00" y1="500.00" x2="96.00" y2="500.00" stroke="#5c564c" stroke-width="1.25" fill="none"/>
  <text x="80.0" y="365.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="end">~1 in</text>
  <line x1="236.00" y1="220.00" x2="236.00" y2="290.00" stroke="#241e18" stroke-width="1.25" fill="none"/>
  <line x1="230.00" y1="220.00" x2="242.00" y2="220.00" stroke="#241e18" stroke-width="1.25" fill="none"/>
  <line x1="230.00" y1="290.00" x2="242.00" y2="290.00" stroke="#241e18" stroke-width="1.25" fill="none"/>
  <text x="246.0" y="260.0" fill="#241e18" font-size="14" font-weight="500" text-anchor="start">~1/4 in</text>
  <text x="48.0" y="560.0" fill="#1a4f3c" font-size="16" font-weight="700" text-anchor="start">Foam remains under the cut.</text>
  <text x="48.0" y="588.0" fill="#5c564c" font-size="15" font-weight="500" text-anchor="start">The edge has a place to sit.</text>
  <text x="48.0" y="640.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">Firm extruded polystyrene.</text>
  <rect x="520.00" y="220.00" width="180.00" height="36.00" rx="0" fill="#f7f1e6" stroke="#241e18" stroke-width="1.5"/>
  <line x1="520.00" y1="223.00" x2="700.00" y2="223.00" stroke="#8a7058" stroke-width="2.2" fill="none"/>
  <line x1="520.00" y1="253.00" x2="700.00" y2="253.00" stroke="#8a7058" stroke-width="2.2" fill="none"/>
  <rect x="596.00" y="220.00" width="22.00" height="36.00" rx="0" fill="#fbf7f0" stroke="#241e18" stroke-width="1.4"/>
  <line x1="607.00" y1="256.00" x2="607.00" y2="290.00" stroke="#8f3d32" stroke-width="1.8" fill="none" stroke-dasharray="4 3"/>
  <line x1="630.00" y1="220.00" x2="630.00" y2="290.00" stroke="#8f3d32" stroke-width="1.4" fill="none"/>
  <line x1="624.00" y1="220.00" x2="636.00" y2="220.00" stroke="#8f3d32" stroke-width="1.4" fill="none"/>
  <line x1="624.00" y1="290.00" x2="636.00" y2="290.00" stroke="#8f3d32" stroke-width="1.4" fill="none"/>
  <text x="520.0" y="318.0" fill="#8f3d32" font-size="15" font-weight="700" text-anchor="start">~1/4 in passes through</text>
  <text x="448.0" y="360.0" fill="#241e18" font-size="16" font-weight="500" text-anchor="start">Usually a few millimeters thick,</text>
  <text x="448.0" y="386.0" fill="#241e18" font-size="16" font-weight="500" text-anchor="start">often with a paper face.</text>
  <text x="448.0" y="422.0" fill="#8f3d32" font-size="16" font-weight="700" text-anchor="start">Skip it for a first piece.</text>
  <text x="448.0" y="470.0" fill="#5c564c" font-size="14" font-weight="500" text-anchor="start">Drawn at the same scale.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="640" height="620" font-family="Segoe UI, system-ui, sans-serif">
  <title>Schematic comparing foam thickness</title>
  <desc>Schematic diagram comparing about 1 inch of XPS foam, which can hold a 1/4 inch groove, with regular display foam board that is usually too thin. Not a photo of a product or an item for sale.</desc>
  <defs>
    <pattern id="foam" patternUnits="userSpaceOnUse" width="10" height="10">
      <rect width="10" height="10" fill="#f3eadc"/>
      <path d="M-1 1 l2 -2 M0 10 L10 0 M9 11 l2 -2" stroke="#e4d5c2" stroke-width="1"/>
    </pattern>
    <pattern id="thin" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#f7f1e6"/>
      <path d="M0 8 L8 0" stroke="#e4d5c2" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="640" height="620" fill="#fffcf6"/>
  <text x="32" y="40" fill="#1e1a16" font-size="22" font-weight="700">Schematic</text>
  <text x="200" y="40" fill="#5e574e" font-size="18">Foam thickness</text>
  <text x="32" y="74" fill="#5e574e" font-size="16">Same groove depth in both drawings: about 1/4 inch.</text>

  <!-- XPS -->
  <rect x="24" y="96" width="292" height="430" fill="#fffdf8" stroke="#e3d9cb"/>
  <text x="40" y="128" fill="#1a4f3c" font-size="18" font-weight="700">About 1 inch XPS</text>
  <line x1="52" y1="168" x2="52" y2="368" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="46" y1="168" x2="58" y2="168" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="46" y1="368" x2="58" y2="368" stroke="#5e574e" stroke-width="1.5"/>
  <text x="64" y="160" fill="#5e574e" font-size="14">~1 in</text>
  <rect x="78" y="168" width="180" height="200" fill="url(#foam)" stroke="#1e1a16" stroke-width="2"/>
  <rect x="156" y="168" width="18" height="50" fill="#fffcf6" stroke="#1e1a16" stroke-width="1.75"/>
  <line x1="184" y1="168" x2="184" y2="218" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="178" y1="168" x2="190" y2="168" stroke="#5e574e" stroke-width="1.5"/>
  <line x1="178" y1="218" x2="190" y2="218" stroke="#5e574e" stroke-width="1.5"/>
  <text x="196" y="198" fill="#1e1a16" font-size="14">~1/4 in</text>
  <text x="40" y="410" fill="#1e1a16" font-size="16">Foam remains under the cut.</text>
  <text x="40" y="438" fill="#1e1a16" font-size="16">The edge has a place to sit.</text>
  <text x="40" y="472" fill="#5e574e" font-size="15">Firm extruded polystyrene.</text>

  <!-- Display board -->
  <rect x="324" y="96" width="292" height="430" fill="#fffdf8" stroke="#e3d9cb"/>
  <text x="340" y="128" fill="#8d4e3c" font-size="18" font-weight="700">Display foam board</text>
  <rect x="378" y="168" width="180" height="28" fill="url(#thin)" stroke="#1e1a16" stroke-width="1.5"/>
  <!-- paper faces -->
  <line x1="378" y1="171" x2="558" y2="171" stroke="#8a7058" stroke-width="2"/>
  <line x1="378" y1="193" x2="558" y2="193" stroke="#8a7058" stroke-width="2"/>
  <!-- groove that passes through: 50px depth vs 28px board -->
  <rect x="456" y="168" width="18" height="28" fill="#fffcf6" stroke="#1e1a16" stroke-width="1.5"/>
  <line x1="465" y1="196" x2="465" y2="218" stroke="#8d4e3c" stroke-width="1.75" stroke-dasharray="3 3"/>
  <line x1="484" y1="168" x2="484" y2="218" stroke="#8d4e3c" stroke-width="1.5"/>
  <line x1="478" y1="168" x2="490" y2="168" stroke="#8d4e3c" stroke-width="1.5"/>
  <line x1="478" y1="218" x2="490" y2="218" stroke="#8d4e3c" stroke-width="1.5"/>
  <text x="340" y="248" fill="#8d4e3c" font-size="15">~1/4 in passes through</text>
  <text x="340" y="290" fill="#1e1a16" font-size="16">Usually only a few millimeters</text>
  <text x="340" y="316" fill="#1e1a16" font-size="16">thick, often with a paper face.</text>
  <text x="340" y="350" fill="#8d4e3c" font-size="16">Skip it for a first piece.</text>
  <text x="340" y="378" fill="#5e574e" font-size="15">Same groove depth as the left.</text>

  <text x="32" y="570" fill="#5e574e" font-size="16">Schematic diagram &#8212; not a photo of a finished product or item for sale.</text>
</svg>

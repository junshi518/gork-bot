<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img">
  <title>Blank fields to read on each stone in a pair</title>
  <rect width="960" height="560" fill="#f3f7fa"/>
  <text x="480" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#4a5c6b">Schematic. Both cards are blank. No report number. No grade. Not a certificate.</text>
  <g font-family="Segoe UI, Helvetica, sans-serif">
    <g>
      <rect x="36" y="48" width="430" height="480" fill="#ffffff" stroke="#16324f" stroke-width="2"/>
      <rect x="36" y="48" width="430" height="64" fill="#16324f"/>
      <text x="52" y="76" font-size="18" font-weight="700" fill="#f3f7f8">Stone A</text>
      <text x="52" y="98" font-size="13" fill="#d5e2ec">Fields to read. Nothing filled in.</text>
    </g>
    <g>
      <rect x="494" y="48" width="430" height="480" fill="#ffffff" stroke="#16324f" stroke-width="2"/>
      <rect x="494" y="48" width="430" height="64" fill="#16324f"/>
      <text x="510" y="76" font-size="18" font-weight="700" fill="#f3f7f8">Stone B</text>
      <text x="510" y="98" font-size="13" fill="#d5e2ec">Its own report. Nothing filled in.</text>
    </g>
    <g font-size="15" fill="#14202b">
      <g>
        <text x="56" y="156" font-weight="700">Laboratory</text>
        <text x="230" y="156" fill="#4a5c6b">as printed</text>
        <text x="514" y="156" font-weight="700">Laboratory</text>
        <text x="688" y="156" fill="#4a5c6b">as printed</text>
        <line x1="56" y1="172" x2="442" y2="172" stroke="#d2dde6"/>
        <line x1="514" y1="172" x2="900" y2="172" stroke="#d2dde6"/>
      </g>
      <g>
        <text x="56" y="214" font-weight="700">Report number</text>
        <text x="230" y="214" fill="#4a5c6b">match the listing</text>
        <text x="514" y="214" font-weight="700">Report number</text>
        <text x="688" y="214" fill="#4a5c6b">its own number</text>
        <line x1="56" y1="230" x2="442" y2="230" stroke="#d2dde6"/>
        <line x1="514" y1="230" x2="900" y2="230" stroke="#d2dde6"/>
      </g>
      <g>
        <text x="56" y="272" font-weight="700">Origin line</text>
        <text x="230" y="272" fill="#4a5c6b">read the line</text>
        <text x="514" y="272" font-weight="700">Origin line</text>
        <text x="688" y="272" fill="#4a5c6b">read the line</text>
        <line x1="56" y1="288" x2="442" y2="288" stroke="#d2dde6"/>
        <line x1="514" y1="288" x2="900" y2="288" stroke="#d2dde6"/>
      </g>
      <g>
        <text x="56" y="330" font-weight="700">Carat weight</text>
        <text x="230" y="330" fill="#4a5c6b">as printed</text>
        <text x="514" y="330" font-weight="700">Carat weight</text>
        <text x="688" y="330" fill="#4a5c6b">as printed</text>
        <line x1="56" y1="346" x2="442" y2="346" stroke="#d2dde6"/>
        <line x1="514" y1="346" x2="900" y2="346" stroke="#d2dde6"/>
      </g>
      <g>
        <text x="56" y="388" font-weight="700">Quality terms</text>
        <text x="230" y="388" fill="#4a5c6b">that lab's words</text>
        <text x="514" y="388" font-weight="700">Quality terms</text>
        <text x="688" y="388" fill="#4a5c6b">that lab's words</text>
        <line x1="56" y1="404" x2="442" y2="404" stroke="#d2dde6"/>
        <line x1="514" y1="404" x2="900" y2="404" stroke="#d2dde6"/>
      </g>
      <g>
        <text x="56" y="446" font-weight="700">Inscription</text>
        <text x="230" y="446" fill="#4a5c6b">if the report cites one</text>
        <text x="514" y="446" font-weight="700">Inscription</text>
        <text x="688" y="446" fill="#4a5c6b">if the report cites one</text>
      </g>
    </g>
    <text x="56" y="500" font-size="13" fill="#4a5c6b">Do not copy a grade onto this drawing. This page assigns none.</text>
  </g>
</svg>

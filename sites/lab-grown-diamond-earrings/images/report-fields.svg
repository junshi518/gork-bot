<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img">
  <title>Schematic of fields to read on a laboratory report</title>
  <rect width="760" height="560" fill="#f3f7fa"/>
  <rect x="28" y="24" width="704" height="512" fill="#ffffff" stroke="#16324f" stroke-width="2"/>
  <rect x="28" y="24" width="704" height="78" fill="#16324f"/>
  <text x="48" y="54" font-family="Segoe UI, Helvetica, sans-serif" font-size="18" fill="#f3f7f8" font-weight="600">Fields to read on the report you have</text>
  <text x="48" y="80" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#d5e2ec">Schematic diagram. Not a certificate. No grade is assigned.</text>
  <g font-family="Segoe UI, Helvetica, sans-serif" font-size="14">
    <g>
      <line x1="48" y1="132" x2="712" y2="132" stroke="#d2dde6"/>
      <text x="48" y="156" fill="#14202b" font-weight="600">Issuing laboratory</text>
      <text x="300" y="156" fill="#4a5c6b">Name printed on the document</text>
    </g>
    <g>
      <line x1="48" y1="176" x2="712" y2="176" stroke="#d2dde6"/>
      <text x="48" y="200" fill="#14202b" font-weight="600">Report or assessment number</text>
      <text x="300" y="200" fill="#4a5c6b">Number you can check with that lab</text>
    </g>
    <g>
      <line x1="48" y1="220" x2="712" y2="220" stroke="#d2dde6"/>
      <text x="48" y="244" fill="#14202b" font-weight="600">Origin statement</text>
      <text x="300" y="244" fill="#4a5c6b">Laboratory-grown or laboratory-created</text>
    </g>
    <g>
      <line x1="48" y1="264" x2="712" y2="264" stroke="#d2dde6"/>
      <text x="48" y="288" fill="#14202b" font-weight="600">Carat weight</text>
      <text x="300" y="288" fill="#4a5c6b">Weight printed for this stone</text>
    </g>
    <g>
      <line x1="48" y1="308" x2="712" y2="308" stroke="#d2dde6"/>
      <text x="48" y="332" fill="#14202b" font-weight="600">Color</text>
      <text x="300" y="332" fill="#4a5c6b">The term that lab prints. Do not convert it.</text>
    </g>
    <g>
      <line x1="48" y1="352" x2="712" y2="352" stroke="#d2dde6"/>
      <text x="48" y="376" fill="#14202b" font-weight="600">Clarity</text>
      <text x="300" y="376" fill="#4a5c6b">The term that lab prints. Do not convert it.</text>
    </g>
    <g>
      <line x1="48" y1="396" x2="712" y2="396" stroke="#d2dde6"/>
      <text x="48" y="420" fill="#14202b" font-weight="600">Cut or quality term</text>
      <text x="300" y="420" fill="#4a5c6b">Cut, or the lab's overall quality words</text>
    </g>
    <g>
      <line x1="48" y1="440" x2="712" y2="440" stroke="#d2dde6"/>
      <text x="48" y="464" fill="#14202b" font-weight="600">Inscription</text>
      <text x="300" y="464" fill="#4a5c6b">Laboratory-Grown and the number, if cited</text>
    </g>
    <line x1="48" y1="484" x2="712" y2="484" stroke="#d2dde6"/>
  </g>
  <text x="48" y="512" font-family="Segoe UI, Helvetica, sans-serif" font-size="13" fill="#4a5c6b">Blank on purpose. This drawing does not describe a stone for sale.</text>
</svg>

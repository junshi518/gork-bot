<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img">
  <title>Solitaire stud compared with a halo stud</title>
  <rect width="960" height="500" fill="#f3f7fa"/>
  <text x="480" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#4a5c6b">Schematic. Same earlobe outline. Not a photograph. Not for sale.</text>
  <line x1="480" y1="48" x2="480" y2="430" stroke="#d2dde6" stroke-width="1"/>
  <text x="240" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#14202b">Solitaire stud</text>
  <text x="240" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#4a5c6b">One stone, face-up on the lobe</text>
  <ellipse cx="240" cy="210" rx="52" ry="72" fill="#ffffff" stroke="#c5d0da" stroke-width="2"/>
  <circle cx="240" cy="262" r="30" fill="#ffffff" stroke="#16324f" stroke-width="3"/>
  <line x1="240" y1="226" x2="240" y2="236" stroke="#8c3d2f" stroke-width="3"/>
  <line x1="240" y1="288" x2="240" y2="298" stroke="#8c3d2f" stroke-width="3"/>
  <line x1="204" y1="262" x2="214" y2="262" stroke="#8c3d2f" stroke-width="3"/>
  <line x1="266" y1="262" x2="276" y2="262" stroke="#8c3d2f" stroke-width="3"/>
  <text x="240" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#14202b">Post through the piercing.</text>
  <text x="240" y="412" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#14202b">Back sits behind the lobe.</text>
  <text x="720" y="68" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#14202b">Halo stud</text>
  <text x="720" y="92" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#4a5c6b">Center stone plus a ring of smaller stones</text>
  <ellipse cx="720" cy="210" rx="52" ry="72" fill="#ffffff" stroke="#c5d0da" stroke-width="2"/>
  <g fill="#ffffff" stroke="#16324f" stroke-width="2.5">
    <circle cx="720" cy="214" r="8"/>
    <circle cx="754" cy="228" r="8"/>
    <circle cx="768" cy="262" r="8"/>
    <circle cx="754" cy="296" r="8"/>
    <circle cx="720" cy="310" r="8"/>
    <circle cx="686" cy="296" r="8"/>
    <circle cx="672" cy="262" r="8"/>
    <circle cx="686" cy="228" r="8"/>
  </g>
  <circle cx="720" cy="262" r="18" fill="#ffffff" stroke="#8c3d2f" stroke-width="3"/>
  <text x="720" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#14202b">Center and each small stone</text>
  <text x="720" y="412" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#14202b">need their own material line.</text>
</svg>

      <text x="360" y="246" text-anchor="middle" fill="#14202b" stroke="none" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="600">Hoop</text>
      <text x="360" y="268" text-anchor="middle" fill="#4a5c6b" stroke="none" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">Ring below the lobe</text>
    </g>
    <g>
      <ellipse cx="600" cy="92" rx="26" ry="34" stroke="#c5d0da" stroke-width="1.5"/>
      <path d="M572 108 C572 168 628 168 628 108" stroke-width="8"/>
      <circle cx="600" cy="78" r="2.5" fill="#16324f" stroke="none"/>
      <text x="600" y="246" text-anchor="middle" fill="#14202b" stroke="none" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="600">Huggie</text>
      <text x="600" y="268" text-anchor="middle" fill="#4a5c6b" stroke="none" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">Small, close fit</text>
    </g>
    <g>

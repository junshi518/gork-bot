      <circle cx="840" cy="118" r="8" stroke-width="2"/>
      <line x1="840" y1="126" x2="840" y2="146" stroke-width="2"/>
      <ellipse cx="840" cy="172" rx="16" ry="24" stroke-width="2"/>
      <text x="840" y="246" text-anchor="middle" fill="#14202b" stroke="none" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="600">Drop</text>
      <text x="840" y="268" text-anchor="middle" fill="#4a5c6b" stroke="none" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">Hangs below the lobe</text>
    </g>

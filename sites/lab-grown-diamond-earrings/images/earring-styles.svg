<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img">
  <title>Schematic of stud, hoop, huggie, and drop earring styles</title>
  <rect width="960" height="340" fill="#f3f7fa"/>
  <text x="480" y="28" text-anchor="middle" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#4a5c6b">Schematic diagram. Not a photograph. Not for sale.</text>
  <g fill="none" stroke="#16324f" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <ellipse cx="120" cy="78" rx="26" ry="36" stroke="#c5d0da" stroke-width="1.5"/>
      <circle cx="120" cy="140" r="16" stroke-width="2"/>
      <line x1="120" y1="156" x2="120" y2="188" stroke-width="2"/>
      <ellipse cx="120" cy="196" rx="16" ry="6" stroke-width="2"/>
      <text x="120" y="246" text-anchor="middle" fill="#14202b" stroke="none" font-family="Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="600">Stud</text>
      <text x="120" y="268" text-anchor="middle" fill="#4a5c6b" stroke="none" font-family="Segoe UI, Helvetica, sans-serif" font-size="13">On the lobe</text>
    </g>
    <g>
      <ellipse cx="360" cy="70" rx="24" ry="32" stroke="#c5d0da" stroke-width="1.5"/>
      <path d="M360 102 v16" stroke-width="2"/>
